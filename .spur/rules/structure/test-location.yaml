# Test-location rules — local override for ts-base's multi-scaffold layout.
# Shadows the global structure/test-location.yaml.
#
# no-tests-dir: forbids __tests__/ directories and src/-adjacent tests.
# require-corresponding-test: info severity — ts-base bundles related tests
#   (e.g. scripts/tests/agent-convergence.test.ts covers multiple modules)
#   rather than maintaining strict 1:1 src→test correspondence.
#   Scaffold source is included because after setup one scaffold becomes real src/.
rules:
  - id: no-tests-dir
    description: "Tests must live in tests/ directories at the same level as src/, not in __tests__."
    severity: error
    evaluator:
      type: test-location
      config:
        expected: "**/*.test.*"
        forbid:
          - "**/__tests__/**"
          - "**/src/**/*.test.ts"
          - "**/src/**/*.test.tsx"
        requireCorrespondingTest: false
    include:
      - "scripts/tests/**/*.test.ts"
      - "scripts/tests/**/*.test.tsx"
      - "src-app/tests/**/*.test.ts"
      - "src-app/tests/**/*.test.tsx"
      - "src-lib/tests/**/*.test.ts"
      - "src-lib/tests/**/*.test.tsx"
      - "src-cli/**/tests/**/*.test.ts"
      - "src-cli/**/tests/**/*.test.tsx"
      - "src-monorepo/**/tests/**/*.test.ts"
      - "src-monorepo/**/tests/**/*.test.tsx"
    exclude:
      - "**/node_modules/**"

  - id: require-corresponding-test
    description: "Every source file must have a corresponding test."
    severity: error
    evaluator:
      type: test-location
      config:
        expected: "**/*.test.*"
        requireCorrespondingTest: true
    include:
      - "scripts/**/*.ts"
      - "src-app/src/**/*.ts"
      - "src-lib/src/**/*.ts"
      - "src-cli/**/src/**/*.ts"
      - "src-monorepo/**/src/**/*.ts"
    exclude:
      - "**/index.ts"
      - "**/*.d.ts"
      - "**/types.ts"
      - "**/node_modules/**"
      - "**/tests/**"
      - "scripts/_modes.ts"
      - "scripts/test-setup.ts"
