# Output boundary rules — keep reusable library/shared-package code free of raw terminal writes.
include:
  - "src-lib/**/*.ts"
  - "src-monorepo/packages/**/src/**/*.ts"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/tests/**"

rules:
  - id: no-console-output
    description: "Reusable library/shared-package source should not write directly to the console."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - -c
          - |
            if rg -n "console\.(log|error|warn|info|debug|dir|time|trace)" src-lib src-monorepo/packages --glob 'src/**/*.ts'; then
              exit 1
            fi
            exit 0
    include:
      - "src-lib/**/*.ts"
      - "src-monorepo/packages/**/src/**/*.ts"

  - id: no-raw-stdout-stderr
    description: "Reusable library/shared-package source should not write directly to stdout/stderr."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - -c
          - |
            if rg -n "process\.(stdout|stderr)\.write" src-lib src-monorepo/packages --glob 'src/**/*.ts'; then
              exit 1
            fi
            exit 0
    include:
      - "src-lib/**/*.ts"
      - "src-monorepo/packages/**/src/**/*.ts"
