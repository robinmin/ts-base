# ESM publishing conventions — keep TS source ergonomic while generated dist stays Node-compatible.
include:
  - "package.json"
  - "scripts/**/*.ts"
  - "src*/**/*.ts"
  - "src*/**/*.tsx"
  - "src-cli/**/*.ts"
  - "src-cli/**/*.tsx"
  - "src-monorepo/**/*.ts"
  - "src-monorepo/**/*.tsx"
  - "tsconfig*.json"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-js-extension-in-ts-source-imports
    description: "TypeScript source should keep relative import/export specifiers extensionless; dist rewriting is handled by scripts/fix-dist-esm-extensions.ts."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "\\b(import|export)\\b[^\\n]*(from\\s+['\"]\\.{1,2}/[^'\"]+\\.js['\"]|import\\s*\\(\\s*['\"]\\.{1,2}/[^'\"]+\\.js['\"])"
    include:
      - "scripts/**/*.ts"
      - "src*/**/*.ts"
      - "src*/**/*.tsx"
      - "src-cli/**/*.ts"
      - "src-cli/**/*.tsx"
      - "src-monorepo/**/*.ts"
      - "src-monorepo/**/*.tsx"
    exclude:
      - "**/dist/**"

  - id: lib-mode-build-script-runs-dist-extension-fixer
    description: "Library mode must build with tsc, then run the Bun TypeScript dist extension fixer."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - -c
          - |
            actual="$(bun -e 'const m = await import("./scripts/_modes.ts"); console.log(m.LIB_SCRIPTS?.build ?? "")')"
            expected='tsc -p tsconfig.build.json && bun scripts/fix-dist-esm-extensions.ts dist'
            if [ "$actual" != "$expected" ]; then
              echo "INVALID: LIB_SCRIPTS.build must be: $expected"
              exit 1
            fi
    include:
      - "scripts/_modes.ts"

  - id: lib-mode-smoke-dist-uses-bun-ts-script
    description: "Library mode smoke test must run the TypeScript smoke script with Bun."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - -c
          - |
            actual="$(bun -e 'const m = await import("./scripts/_modes.ts"); console.log(m.LIB_SCRIPTS?.["smoke:dist"] ?? "")')"
            expected='bun scripts/smoke-dist-imports.ts'
            if [ "$actual" != "$expected" ]; then
              echo "INVALID: LIB_SCRIPTS.smoke:dist must be: $expected"
              exit 1
            fi
    include:
      - "scripts/_modes.ts"

  - id: lib-mode-build-tsconfig-emits-dist
    description: "Library mode must include a tsconfig.build.json that emits JS and declarations to dist."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - -c
          - |
            actual="$(bun -e 'const p = await Bun.file("./tsconfig.build.json").json(); console.log([p.compilerOptions?.noEmit, p.compilerOptions?.emitDeclarationOnly, p.compilerOptions?.outDir].join("|"))')"
            expected='false|false|dist'
            if [ "$actual" != "$expected" ]; then
              echo "INVALID: tsconfig.build.json must emit JS and declarations to dist"
              exit 1
            fi
    include:
      - "tsconfig.build.json"
