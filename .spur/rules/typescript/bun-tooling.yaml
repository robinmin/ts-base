# Bun/tooling rules — ts-base standardizes on Bun + bun:test (AGENTS.md "Stack").
# Adapted from ts-libs, re-scoped to ts-base's multi-scaffold layout.
# The server Cloudflare Workers Vitest exception is removed — ts-base has no
# Workers runtime.
include:
  - "package.json"
  - "scripts/**/*.ts"
  - "src-app/**/*.ts"
  - "src-lib/**/*.ts"
  - "src-cli/**/*.ts"
  - "src-monorepo/**/*.ts"
  - ".spur/**/*.yaml"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-npm-pnpm-yarn-scripts
    description: "Use bun scripts instead of npm, pnpm, or yarn commands (AGENTS.md: no npm/pnpm/yarn)."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "\\b(npm run|pnpm|yarn)\\b"
    include:
      - "package.json"
      - "src-app/package.json"
      - "src-lib/package.json"
      - "src-cli/package.json"
      - "src-cli/apps/*/package.json"
      - "src-cli/packages/*/package.json"
      - "src-monorepo/package.json"
      - "src-monorepo/apps/*/package.json"
      - "src-monorepo/packages/*/package.json"
      - "scripts/**/*.ts"
      - "**/*.yml"
      - "**/*.yaml"
    exclude:
      - ".spur/rules/**"

  - id: enforce-bun-test
    description: "Unit/integration tests must use bun:test, not Jest or Mocha."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: 'from [''"](jest|mocha|@jest)'
    include:
      - "scripts/**/*.test.ts"
      - "src-app/**/*.test.ts"
      - "src-lib/**/*.test.ts"
      - "src-cli/**/*.test.ts"
      - "src-monorepo/**/*.test.ts"

  - id: no-vitest-imports-or-apis
    description: "Use bun:test APIs instead of vitest."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "from ['\"]vitest['\"]|vi\\.(fn|spyOn|mock|stub)\\b"
    include:
      - "scripts/**/*.ts"
      - "src-app/**/*.ts"
      - "src-lib/**/*.ts"
      - "src-cli/**/*.ts"
      - "src-monorepo/**/*.ts"
