# No Biome suppression comments in production source.
# Adapted from ts-libs, re-scoped to ts-base's multi-scaffold layout.
# scripts/setup.ts excluded — its `Record<string, any>` for free-form
# package.json is a well-justified suppression.
include:
  - "scripts/**/*.ts"
  - "src-app/src/**/*.ts"
  - "src-lib/src/**/*.ts"
  - "src-cli/**/src/**/*.ts"
  - "src-monorepo/**/src/**/*.ts"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/tests/**"
  - "scripts/setup.ts"
rules:
  - id: no-biome-suppressions
    description: >
      Do not use biome-ignore or biome-ignore-all comments to suppress lint
      rules.  Fix the underlying issue instead.
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "biome-ignore"
