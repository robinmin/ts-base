# Bun/tooling rules — this repository standardizes on Bun and bun:test.
include:
  - "package.json"
  - "scripts/**/*.ts"
  - "src*/**/*.ts"
  - "src*/**/*.tsx"
  - "src-cli/**/*.ts"
  - "src-cli/**/*.tsx"
  - "src-monorepo/**/*.ts"
  - "src-monorepo/**/*.tsx"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "vendors/**"

rules:
  - id: no-npm-pnpm-yarn-scripts
    description: "Use bun scripts instead of npm, pnpm, or yarn commands."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "\\b(npm run|pnpm|yarn)\\b"
    include:
      - "package.json"

  - id: enforce-bun-test
    description: "Test files must use bun:test, not Vitest, Jest, or Mocha."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: 'from [''"](vitest|jest|mocha|@jest|@vitest)'
    include:
      - "src*/**/*.test.ts"
      - "src*/**/*.spec.ts"
      - "src-cli/**/*.test.ts"
      - "src-cli/**/*.spec.ts"
      - "src-monorepo/**/*.test.ts"
      - "src-monorepo/**/*.spec.ts"

  - id: no-vitest-imports-or-apis
    description: "Use bun:test APIs instead of vitest imports or vi.* helpers."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "from ['\"]vitest['\"]|vi\\.(fn|spyOn|mock|stub)\\b|vitest\\.config"
    include:
      - "scripts/**/*.ts"
      - "src*/**/*.ts"
      - "src*/**/*.tsx"
      - "src-cli/**/*.ts"
      - "src-cli/**/*.tsx"
      - "src-monorepo/**/*.ts"
      - "src-monorepo/**/*.tsx"
      - "package.json"
