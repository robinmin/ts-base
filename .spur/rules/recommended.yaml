# Add local rule categories to extends to override or supplement global rules.
# Create category folders under .spur/rules/ (e.g. my-rules/).
name: recommended
extends:
  - typescript/bun-only
  - typescript/esm-build-conventions
  - typescript/no-biome-suppressions
  - typescript/no-raw-output
  - structure
  - quality
  - meta
